name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages (main /)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: 'legacy',
                source: { branch: 'main', path: '/' },
              });
              core.info('Created GitHub Pages site');
            } catch (error) {
              if (error.status === 409) {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner,
                  repo,
                  build_type: 'legacy',
                  source: { branch: 'main', path: '/' },
                });
                core.info('Updated GitHub Pages site');
              } else {
                throw error;
              }
            }
            await github.rest.repos.requestPagesBuild({ owner, repo });
