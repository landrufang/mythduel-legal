name: Enable GitHub Pages (legacy main)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-github-pages.yml

permissions:
  administration: write
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: 'legacy',
                source: { branch: 'main', path: '/' },
              });
              core.info('Created Pages site (legacy, main /)');
            } catch (error) {
              if (error.status === 409) {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner,
                  repo,
                  build_type: 'legacy',
                  source: { branch: 'main', path: '/' },
                });
                core.info('Updated Pages site');
              } else {
                throw error;
              }
            }
            await github.rest.repos.requestPagesBuild({ owner, repo });
